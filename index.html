<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
html,body{margin:0;height:100%;background:#080a10;color:#dfe6ff;overflow:hidden;

#dev .top{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:15px}

<div id="wrap"><canvas id="c"></canvas></div>
<script>
(()=>{
'use strict';
/* =========================================================
   화면 / 월드
   ========================================================= */
const W=960,H=600;            // 화면 논리 크기 (HUD 좌표)
const Z=.6;                    // 줌: 월드 1600×1000이 한 화면에 보임
const VW=W/Z,VH=H/Z;
const WW=5600,WH=3600;         // 맵 크기
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const s=Math.min(innerWidth/W,innerHeight/H);
  const w=Math.max(240,Math.floor(W*s)),h=Math.floor(w*H/W);
  cv.style.width=w+'px';cv.style.height=h+'px';
  cv.width=Math.floor(w*dpr);cv.height=Math.floor(h*dpr);
}
addEventListener('resize',resize);resize();

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const mass=r=>{const v=r/.64;return v*v/100;};
const VMAX=2200;
const VTof=r=>600*Math.pow(14/r,.6)*(U.spd||1)*(1+.012*((typeof lvl==='number'?lvl:1)-1)); // 레벨마다 최고 속도 +1.2%     // 크기별 최고 속도: 작을수록 빠름 (추진력 강화로 증가)
const FONT='system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif';
/* 운동량 피해 규칙
   - 충돌 충격량 J = (1+e)·접근속도 / (1/m₁ + 1/m₂)   (양쪽 동일)
   - 적: 내구도가 J만큼 깎임
   - 적이 부서지면 힘은 부서지는 순간까지만 전달 → 내가 받는 충격량 = min(J, 적 남은 내구도)
   - 나: 받은 충격량 ÷ 내 질량 = 내 속도 변화 → × DV_DMG 만큼 HP 피해
   - HP는 계속 회복 */
const REST=.3,DV_DMG=.12;

/* =========================================================
   오디오
   ========================================================= */
/* ---------- 설정 (Esc) ---------- */
const DEF_KEYS={up:['KeyW','ArrowUp'],down:['KeyS','ArrowDown'],left:['KeyA','ArrowLeft'],right:['KeyD','ArrowRight'],shrink:['KeyL','KeyQ'],grow:['Semicolon','KeyE']};
const ACT_NAME={up:'위로 이동',down:'아래로 이동',left:'왼쪽 이동',right:'오른쪽 이동',shrink:'작아지기',grow:'커지기'};
const S={vol:.8,shake:1,flash:true,keys:JSON.parse(JSON.stringify(DEF_KEYS))};
try{const o=JSON.parse(localStorage.getItem('mass-settings')||'null');
  if(o){if(typeof o.vol==='number')S.vol=o.vol;if(typeof o.shake==='number')S.shake=o.shake;if(typeof o.flash==='boolean')S.flash=o.flash;
    if(o.keys)for(const a in DEF_KEYS)if(Array.isArray(o.keys[a]))S.keys[a]=o.keys[a].slice(0,2);}}catch(e){}
function saveSettings(){try{localStorage.setItem('mass-settings',JSON.stringify(S));}catch(e){}}
const act=a=>{const k=S.keys[a];return !!(k&&(keys[k[0]]||keys[k[1]]));};
const KEY_LABEL={Semicolon:';',Quote:"'",Comma:',',Period:'.',Slash:'/',Backslash:'\\',BracketLeft:'[',BracketRight:']',Minus:'-',Equal:'=',Backquote:'`',
  Space:'Space',ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→',ShiftLeft:'L-Shift',ShiftRight:'R-Shift',ControlLeft:'L-Ctrl',ControlRight:'R-Ctrl',
  AltLeft:'L-Alt',AltRight:'R-Alt',Tab:'Tab',CapsLock:'Caps',Backspace:'Backspace'};
function keyName(c){if(!c)return '—';if(KEY_LABEL[c])return KEY_LABEL[c];if(c.startsWith('Key'))return c.slice(3);if(c.startsWith('Digit'))return c.slice(5);if(c.startsWith('Numpad'))return 'Num'+c.slice(6);return c;}
const keyHint=a=>{const k=S.keys[a].filter(Boolean).map(keyName);return k.length>1?k[0]+' (또는 '+k[1]+')':k[0]||'—';};
let AC=null,nb=null,master=null;
function initAudio(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.connect(AC.destination);setVolume();}if(AC&&AC.state==='suspended')AC.resume();}catch(e){AC=null;}}
function setVolume(){if(master)master.gain.value=S.vol*S.vol;}
function noiseBuf(){
  if(nb||!AC)return nb;
  const len=Math.floor(AC.sampleRate*.2);nb=AC.createBuffer(1,len,AC.sampleRate);
  const d=nb.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);return nb;
}
let sfxBudget=0;
// 효과음 종류별 동시 재생 최대치: 넘치면 가장 오래된 소리를 짧게 줄이며 끊고 새 소리를 재생
const SFX_MAX={hit:6,boom:3,hurt:2,orb:4,zap:4};
const VOICES={};
function voice(kind,dur){
  const t=AC.currentTime,L=VOICES[kind]||(VOICES[kind]=[]);
  for(let i=L.length-1;i>=0;i--)if(L[i].end<=t)L.splice(i,1);
  while(L.length>=SFX_MAX[kind]){
    const v=L.shift();
    try{v.g.gain.cancelScheduledValues(t);v.g.gain.setValueAtTime(v.g.gain.value,t);v.g.gain.linearRampToValueAtTime(0,t+.015);}catch(e){}
    for(const x of v.src){try{x.stop(t+.02);}catch(e){}}
  }
  const g=AC.createGain();g.connect(master||AC.destination);
  const v={g,src:[],end:t+dur};L.push(v);return v;
}
function sfx(I,kill,cmb,dist){
  if(!AC||sfxBudget>6)return;sfxBudget++;
  try{
    const att=1/(1+(dist||0)/700);
    const t=AC.currentTime,vol=Math.min(.4,.05+I/9000)*att;
    const base=(kill?170:115)*Math.pow(2,Math.min(cmb,14)/12);
    const V=voice('hit',.26),o=AC.createOscillator(),g=AC.createGain();V.src.push(o);
    o.type='sine';o.frequency.setValueAtTime(base*1.9,t);o.frequency.exponentialRampToValueAtTime(Math.max(28,base*.32),t+.2);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+.24);
    o.connect(g);g.connect(V.g);o.start(t);o.stop(t+.26);
    const b=noiseBuf();if(b){const n=AC.createBufferSource(),ng=AC.createGain();V.src.push(n);n.buffer=b;ng.gain.value=vol*.7;n.connect(ng);ng.connect(V.g);n.start(t);}
  }catch(e){}
}
function sfxBoom(dist){
  if(!AC)return;
  try{const t=AC.currentTime,att=1/(1+dist/600),V=voice('boom',.6),o=AC.createOscillator(),g=AC.createGain();V.src.push(o);
    o.type='sine';o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(25,t+.5);
    g.gain.setValueAtTime(.45*att,t);g.gain.exponentialRampToValueAtTime(.001,t+.55);
    o.connect(g);g.connect(V.g);o.start(t);o.stop(t+.6);
    const b=noiseBuf();if(b){const n=AC.createBufferSource(),ng=AC.createGain();V.src.push(n);n.buffer=b;n.playbackRate.value=.5;ng.gain.value=.5*att;n.connect(ng);ng.connect(V.g);n.start(t);}
  }catch(e){}
}
function sfxCherenkov(){
  if(!AC)return;
  try{const t=AC.currentTime,V=voice('boom',.5);
    for(const [f0,f1,v] of [[2400,900,.07],[3100,1300,.04]]){const o=AC.createOscillator(),g=AC.createGain();V.src.push(o);
      o.type='sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+.45);
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.48);
      o.connect(g);g.connect(V.g);o.start(t);o.stop(t+.5);}
    const o=AC.createOscillator(),g=AC.createGain();V.src.push(o);o.type='sine';o.frequency.setValueAtTime(70,t);o.frequency.exponentialRampToValueAtTime(30,t+.3);
    g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.connect(g);g.connect(V.g);o.start(t);o.stop(t+.35);
  }catch(e){}
}
function sfxHurt(){
  if(!AC)return;
  try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    const V=voice('hurt',.3);V.src.push(o);
    o.type='sawtooth';o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.25);
    g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);
    o.connect(g);g.connect(V.g);o.start(t);o.stop(t+.3);}catch(e){}
}
function sfxOrb(n){
  if(!AC)return;
  try{const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
    const V=voice('orb',.11);V.src.push(o);
    o.type='sine';o.frequency.value=620*Math.pow(2,Math.min(n,24)/24);
    g.gain.setValueAtTime(.04,t);g.gain.exponentialRampToValueAtTime(.001,t+.1);
    o.connect(g);g.connect(V.g);o.start(t);o.stop(t+.11);}catch(e){}
}

/* =========================================================
   상태
   ========================================================= */
const keys={};
const SHAKE_MAX=12;   // 카메라 진동 상한 (화면 px)
const MACH=1150;                // 성운(매질) 속 빛의 속도 = 진공 광속의 절반 (굴절률 2). 넘으면 체렌코프 빛 원뿔
const C_LIGHT=MACH*2;           // 진공 광속 (속도 표시용: 최고 속도 2200도 1c를 넘지 않음)
const WAVE_DT=.012,WAVE_MAXR=3120;   // 충격파가 뻗는 거리
let P_sp={};
let waves=[],shockSegs=[],lastWave=0,slowT=0,novaT=0,novaFx=0,holes=[],holeCd=0;
let tut=null;
let flames=[],missiles=[],mines=[],auraT=0,flameT=0,missileT=1,mineT=0;
let evoSeen={},spMode=false,sel=0,pbullets=[],bolts=[],moons=[],chainCd=0,shrapCd=0,growPulseT=0,moonAng=0;
let state='title',P,enemies=[],bullets=[],parts=[],rings=[],texts=[],debris=[],rocks=[],orbs=[],booms=[];
let pierceN=0,pierceT=0,orbMul=1;   // 관통: 0.5초 안에 몸으로 연속 처치한 수, 구슬 값 배율
let combo=0,comboT=0,score=0,kills=0,bestImpact=0,shake=0,hitstop=0,time=0,flash=0,banner=0,bannerText='';
let opts=[],best=0,lastHS=-1,sweepN=0,sweepT=0,sweepShow=0,sweepBest=0;
let heavyT=18,xp=0,lvl=1,pendingLv=0,packT=0,surgeT=0,surgeN=0,eliteT=0,orbStreak=0,orbStreakT=0;
const U={};
const cam={x:0,y:0};
const xpNeed=L=>Math.round(10+8*Math.pow(L-1,1.4));
const fmtT=t=>{t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');};
try{best=parseInt(localStorage.getItem('mass_best_t2')||'0',10)||0;}catch(e){}

/* =========================================================
   진화: 8개 무기 중 2개 조합 28종
   두 무기를 모두 최대 레벨로 올리면 진화 카드가 나옴 (슬롯 차지 안 함).

const EVO_DESC={

  'chain+aura':'번개가 지나간 선을 따라 넓은 캡슐 모양 자기장이 5초 남음. 겹친 영역은 하나로 합쳐짐',

  'shrap+hole':'추가 탄환 대신 블랙홀 6개가 탄환처럼 날아가다 끝에서 터짐',

  'aura+mine':'지뢰가 터진 자리에 최소 크기 때와 같은 자기장이 4초 남음. 지뢰가 근처 적에게 천천히 다가감',

  'chain+shrap':'번개탄','chain+hole':'뇌운 특이점','chain+orbit':'뇌전 위성','chain+aura':'폭풍 코일','chain+fire':'플라즈마 화염',

  'fire+missile':'화염 미사일','fire+mine':'화염 지뢰','missile+mine':'연쇄 기폭'};
const EVOS=[];
for(let i=0;i<EVO_W.length;i++)for(let j=i+1;j<EVO_W.length;j++){
  const a=EVO_W[i],b=EVO_W[j],key=a+'+'+b;
  EVOS.push({key,a,b,name:EVO_NAME[key],d:EVO_DESC[key]});
}
const UPS=[
  {n:'거대화',d:'최대 크기 +8',f:()=>{U.rmax+=8;}},
  {n:'급변',d:'크기 변화 속도 +30%',f:()=>{U.sizeRate*=1.3;}},

// 체력 재생: 레벨마다 +4.5% (최대 체력 +8%의 약 56%)
function hpRegenRate(){return (6+U.hpRegen)*(1+.045*(lvl-1));}
function syncHp(){const n=Math.round((100+8*(lvl-1))*U.hpMul);if(n>U.hpMax)P.hp+=n-U.hpMax;U.hpMax=n;}
function mkEnemy(type,x,y){
  const d=ET[type];
  const tm=tut?0:time/60,hpM=1+.3*tm+.05*tm*tm;   // 튜토리얼 중엔 시간 보정 없음
  const e={x,y,vx:0,vy:0,hitCd:0,stun:0,spawn:.5,type,dead:false,r:d.r,hp:d.hp*hpM,max:d.hp*hpM,spd:d.spd*(1+Math.min(.6,time/600)),acc:d.acc,c:d.c,score:d.score};
  if(type==='shooter'){e.shoot=1+Math.random();e.dirS=Math.random()<.5?1:-1;e.flip=2;}
  if(type==='charger'){e.st='idle';e.stT=1.2+Math.random();e.ang=0;}
  return e;
}
function pickType(){
  // 시간이 지날수록 체력 높은 적(방패병·돌진병·가시·분열체) 비중이 커짐
  const tm=Math.min(15,time/60);
  const w=[['chaser',Math.max(.35,1-.05*tm)]];
  if(time>15)w.push(['swarm',.6]);
  if(time>20)w.push(['shield',.18+.09*tm]);
  if(time>35)w.push(['charger',.25+.07*tm]);
  if(time>60)w.push(['bomber',.22]);
  if(time>70)w.push(['spiker',.16+.05*tm]);
  if(time>90)w.push(['shooter',.14]);
  if(time>100)w.push(['splitter',.16+.06*tm]);
  let s=0;for(const x of w)s+=x[1];let q=Math.random()*s;
  for(const x of w){q-=x[1];if(q<=0)return x[0];}
  return 'chaser';
}

function genRocks(){
  rocks=[];
  for(let k=0;k<400&&rocks.length<42;k++){
    const r=rnd(28,110),x=rnd(r+40,WW-r-40),y=rnd(r+40,WH-r-40);
    if(Math.hypot(x-WW/2,y-WH/2)<700)continue;
    let ok=true;for(const o of rocks)if(Math.hypot(o.x-x,o.y-y)<o.r+r+90){ok=false;break;}
    if(ok){
      const pts=[];const n=9+Math.floor(Math.random()*5);
      for(let i=0;i<n;i++)pts.push(rnd(.82,1.08));
      rocks.push({x,y,r,pts,rot:Math.random()*6});
    }
  }
}

function levelUp(){
  state='upgrade';
  const L=lvl-pendingLv+1;
  if(SP_LEVELS.includes(L)&&spCount()<MAX_SP){
    const sp=UPS.map((u,i)=>i).filter(i=>UPS[i].sp&&!U.sp[UPS[i].sp]);
    opts=[];while(opts.length<3&&sp.length)opts.push(sp.splice(Math.floor(Math.random()*sp.length),1)[0]);
    spMode=true;sel=Math.min(1,opts.length-1);return;
  }
  spMode=false;
  const full=weaponCount()>=MAX_WEAPONS; // 슬롯이 다 차면 새 무기는 안 나오고, 가진 무기 강화만
  const pool=UPS.map((u,i)=>i).filter(i=>!UPS[i].sp&&!(UPS[i].evo&&!evoReady(EVOS.find(e=>e.key===UPS[i].evo)))&&!(UPS[i].once==='shock'&&U.shock)&&!(UPS[i].w&&lvOf(UPS[i])>=UPS[i].max)&&!(UPS[i].k&&(U[UPS[i].k]||0)>=UPS[i].max)&&!(full&&isWeapon(UPS[i])&&lvOf(UPS[i])===0));
  opts=[];
  // 무기 카드가 최소 1장은 나오게 (남아 있으면)
  // 진화 카드: 처음 준비됐을 땐 반드시, 한 번 넘긴 진화는 35% 확률로만 다시 나옴
  const ep=pool.filter(i=>UPS[i].evo);
  for(const i of ep)pool.splice(pool.indexOf(i),1);
  const fresh=ep.filter(i=>!evoSeen[UPS[i].evo]),old=ep.filter(i=>evoSeen[UPS[i].evo]&&Math.random()<.35);
  const ec=fresh.length?fresh:old;
  if(ec.length){const i=ec[Math.floor(Math.random()*ec.length)];opts.push(i);evoSeen[UPS[i].evo]=true;}
  const wp=pool.filter(i=>isWeapon(UPS[i]));
  if(wp.length&&opts.length<3){const i=wp[Math.floor(Math.random()*wp.length)];opts.push(i);pool.splice(pool.indexOf(i),1);}
  while(opts.length<3&&pool.length)opts.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  opts.sort(()=>Math.random()-.5);
  sel=Math.min(1,opts.length-1);
}
function pick(i){
  if(state!=='upgrade'||i<0||i>=opts.length)return;
  UPS[opts[i]].f();pendingLv--;

}

/* ---------- 스폰 ---------- */
function freeSpot(x,y,r){for(const o of rocks)if(Math.hypot(o.x-x,o.y-y)<o.r+r+6)return false;return true;}
function spawnAt(type,x,y,vx,vy){
  x=clamp(x,50,WW-50);y=clamp(y,50,WH-50);
  if(!freeSpot(x,y,ET[type].r))return null;
  const e=mkEnemy(type,x,y);
  if(vx!==undefined){e.vx=vx;e.vy=vy;e.spawn=0;e.stun=.35;}
  enemies.push(e);return e;
}
function packCenter(ang){
  const a=ang===undefined?Math.random()*Math.PI*2:ang,d=rnd(980,1150);
  let cx=P.x+Math.cos(a)*d,cy=P.y+Math.sin(a)*d;
  if(cx<60||cx>WW-60||cy<60||cy>WH-60){cx=P.x-Math.cos(a)*d;cy=P.y-Math.sin(a)*d;}
  return [clamp(cx,60,WW-60),clamp(cy,60,WH-60)];
}
function spawnPack(n,ang,type){
  const [cx,cy]=packCenter(ang);
  for(let i=0;i<n;i++)spawnAt(type||pickType(),cx+rnd(-80,80),cy+rnd(-80,80));
}

function tutUpdate(dt){
  if(!tut)return;
  if(tut.step===1){tut.dist+=Math.hypot(P.x-tut.lx,P.y-tut.ly);tut.lx=P.x;tut.ly=P.y;if(tut.dist>500)tutNext();}

// 위성: 내 주위를 도는 무거운 구슬. 적과 부딪히면 위성 속도로 충격량
function updateHunters(dt){   // 전자 고리: 위성 12개가 화면 곳곳에 흩어져 각자 적을 사냥 (자기장에 묶이지 않음)
  const NH=12,MH=4,M=40;   // MH: 위성 질량, M: 화면 가장자리 여유
  const x0=cam.x+M,y0=cam.y+M,x1=cam.x+VW-M,y1=cam.y+VH-M;
  // 화면을 4×3 칸으로 나눠 위성마다 담당 구역을 줌 → 한곳에 뭉치지 않음
  while(hunters.length<NH){const i=hunters.length,u=((i%4)+.5)/4,v=(Math.floor(i/4)+.5)/3;
    hunters.push({u,v,x:P.x+rnd(-60,60),y:P.y+rnd(-60,60),vx:rnd(-300,300),vy:rnd(-300,300),wx:u,wy:v,wt:0});}
  moons.length=0;const claimed=new Set();
  for(const h of hunters){
    const hx=cam.x+h.u*VW,hy=cam.y+h.v*VH;   // 담당 구역 중심 (화면 기준)
    // 목표: 화면 안 적 중 (나와의 거리 + 구역 중심과의 거리 절반)이 가장 작은 것, 다른 위성이 잡은 적은 피함
    let t=null,bs=1e9;
    for(const e of enemies){if(e.dead||e.spawn>0||claimed.has(e))continue;
      if(e.x<cam.x||e.x>cam.x+VW||e.y<cam.y||e.y>cam.y+VH)continue;
      const sc=Math.hypot(e.x-h.x,e.y-h.y)+.5*Math.hypot(e.x-hx,e.y-hy);if(sc<bs){bs=sc;t=e;}}
    if(t)claimed.add(t);
    let ax,ay;
    if(t){ax=t.x-h.x;ay=t.y-h.y;}
    else{   // 사냥감이 없으면 자기 구역 안을 떠돌아다님
      h.wt-=dt;const wx=cam.x+h.wx*VW,wy=cam.y+h.wy*VH;
      if(h.wt<=0||Math.hypot(wx-h.x,wy-h.y)<50){h.wt=rnd(.8,1.8);h.wx=clamp(h.u+rnd(-.12,.12),.05,.95);h.wy=clamp(h.v+rnd(-.16,.16),.05,.95);}
      ax=cam.x+h.wx*VW-h.x;ay=cam.y+h.wy*VH-h.y;}
    const al=Math.hypot(ax,ay)||1;ax=ax/al*4200;ay=ay/al*4200;
    for(const o of hunters){if(o===h)continue;const dx=h.x-o.x,dy=h.y-o.y,d=Math.hypot(dx,dy);if(d<160&&d>1e-3){ax+=dx/d*(160-d)*12;ay+=dy/d*(160-d)*12;}}   // 서로 떨어지게
    // 화면 가장자리에 다가가면 안쪽으로 밀어줌
    const EB=120,EK=40;
    if(h.x<x0+EB)ax+=(x0+EB-h.x)*EK;if(h.x>x1-EB)ax-=(h.x-x1+EB)*EK;
    if(h.y<y0+EB)ay+=(y0+EB-h.y)*EK;if(h.y>y1-EB)ay-=(h.y-y1+EB)*EK;
    h.vx+=ax*dt;h.vy+=ay*dt;
    const sp=Math.hypot(h.vx,h.vy),MX=1300;if(sp>MX){h.vx*=MX/sp;h.vy*=MX/sp;}
    h.x+=h.vx*dt;h.y+=h.vy*dt;
    // 그래도 화면 밖으로 나가면 벽처럼 튕김 (카메라가 순간 이동한 경우 등)
    if(h.x<x0){h.x=x0;if(h.vx<0)h.vx*=-.5;}if(h.x>x1){h.x=x1;if(h.vx>0)h.vx*=-.5;}
    if(h.y<y0){h.y=y0;if(h.vy<0)h.vy*=-.5;}if(h.y>y1){h.y=y1;if(h.vy>0)h.vy*=-.5;}
    moons.push({x:h.x,y:h.y});
    // 충돌: 순수 운동량 교환. 다가가는 상대 속도만큼 충격량, 위성도 그만큼 되튕김
    for(const e of enemies){if(e.dead||e.spawn>0||(e.moonCd||0)>time)continue;const ex=e.x-h.x,ey=e.y-h.y,q=Math.hypot(ex,ey);if(q>e.r+10||q<1e-6)continue;
      const nx=ex/q,ny=ey/q,cl=(h.vx-e.vx)*nx+(h.vy-e.vy)*ny;if(cl<=0)continue;
      const J=(1+REST)*cl/(1/MH+1/mass(e.r));

      h.vx-=J/MH*nx;h.vy-=J/MH*ny;}
  }
}

// 바위 격자: 바위는 움직이지 않으므로 칸마다 "가까울 수 있는 바위" 목록을 미리 만들어 둠 (성능용, 결과는 전체 검사와 같음)
const RG_C=200,RG_M=150;let rgFor=null,rgW=0,rgH=0,rgCells=null;
function rockGrid(){
  rgFor=rocks;rgW=Math.ceil(WW/RG_C)+2;rgH=Math.ceil(WH/RG_C)+2;rgCells=Array.from({length:rgW*rgH},()=>[]);
  rocks.forEach((k,i)=>{const R=k.r+RG_M;
    for(let cy=0;cy<rgH;cy++)for(let cx=0;cx<rgW;cx++){const x0=(cx-1)*RG_C,y0=(cy-1)*RG_C,nx=Math.max(x0,Math.min(k.x,x0+RG_C)),ny=Math.max(y0,Math.min(k.y,y0+RG_C));
      if((k.x-nx)**2+(k.y-ny)**2<=R*R)rgCells[cy*rgW+cx].push(k);}});
}
function circleRockPush(o,rad){ // 바위에서 밀어내고 법선/접근속도 반환
  if(rgFor!==rocks)rockGrid();
  const cx=Math.floor(o.x/RG_C)+1,cy=Math.floor(o.y/RG_C)+1;
  const list=rad<=RG_M-50&&cx>=0&&cy>=0&&cx<rgW&&cy<rgH?rgCells[cy*rgW+cx]:rocks;   // 아주 큰 물체·맵 밖은 전체 검사
  for(const k of list){
    const dx=o.x-k.x,dy=o.y-k.y,d=Math.hypot(dx,dy);
    const R=k.r+rad;
    if(d>=R||d<1e-6)continue;
    const nx=dx/d,ny=dy/d;
    o.x=k.x+nx*R;o.y=k.y+ny*R;
    const cl=-(o.vx*nx+o.vy*ny);       // 바위 쪽으로 다가가던 속도
    if(cl>0)return {nx,ny,cl};
  }
  return null;
}

        const vn=P.vx*nx+P.vy*ny;if(vn>0){P.vx-=2*vn*nx;P.vy-=2*vn*ny;}
        if(J>200)shards(P.x+nx*P.r,P.y+ny*P.r,8,'#bfeaff',600);
      }else{P.vx-=nx*dvP;P.vy-=ny*dvP;}
      damagePlayer(dvP*DV_DMG*pm);

  {let g=0;while(booms.length&&g++<40)explode(booms.shift());}

/* 적끼리: 겹치지 않게 밀어내고, 날아가던(기절한) 적이 부딪히면 충격량만큼 서로 피해 */
// 적끼리 밀어내기용 격자 (매 프레임 Map·배열을 새로 만들지 않도록 재사용. 처리 순서는 예전과 같음)
const SG_C=64,SG_P=2;let sgW=0,sgH=0,sgHead=null,sgNext=null,sgTail=null;
function separate(){
  const C=SG_C;
  if(!sgHead){sgW=Math.ceil(WW/C)+2*SG_P;sgH=Math.ceil(WH/C)+2*SG_P;sgHead=new Int32Array(sgW*sgH);sgTail=new Int32Array(sgW*sgH);}
  if(!sgNext||sgNext.length<enemies.length)sgNext=new Int32Array(Math.max(256,enemies.length*2));
  sgHead.fill(-1);
  const cellOf=(x,y)=>{let gx=Math.floor(x/C)+SG_P,gy=Math.floor(y/C)+SG_P;if(gx<0)gx=0;else if(gx>=sgW)gx=sgW-1;if(gy<0)gy=0;else if(gy>=sgH)gy=sgH-1;return gy*sgW+gx;};
  for(let i=0;i<enemies.length;i++){const e=enemies[i];if(e.dead)continue;const c=cellOf(e.x,e.y);sgNext[i]=-1;if(sgHead[c]<0)sgHead[c]=i;else sgNext[sgTail[c]]=i;sgTail[c]=i;}   // 칸마다 번호 오름차순 연결 목록
  for(let i=0;i<enemies.length;i++){
    const e=enemies[i];if(e.dead)continue;
    const gx=Math.floor(e.x/C)+SG_P,gy=Math.floor(e.y/C)+SG_P;
    for(let ox=-1;ox<=1;ox++)for(let oy=-1;oy<=1;oy++){
      const x=gx+ox,y=gy+oy;if(x<0||y<0||x>=sgW||y>=sgH)continue;
      for(let j=sgHead[y*sgW+x];j>=0;j=sgNext[j]){
        if(j<=i)continue;const o=enemies[j];if(o.dead)continue;
        const dx=o.x-e.x,dy=o.y-e.y,d=Math.hypot(dx,dy),R=e.r+o.r;
        if(d>=R||d<1e-6)continue;
        const nx=dx/d,ny=dy/d,me=mass(e.r),mo=mass(o.r);
        const we=mo/(me+mo),wo=me/(me+mo),pen=R-d;
        e.x-=nx*pen*we;e.y-=ny*pen*we;o.x+=nx*pen*wo;o.y+=ny*pen*wo;
        const cl=(e.vx-o.vx)*nx+(e.vy-o.vy)*ny;
        if(cl<=0)continue;
        const J=(1+REST)*cl/(1/me+1/mo);
        e.vx-=nx*J/me;e.vy-=ny*J/me;o.vx+=nx*J/mo;o.vy+=ny*J/mo;
        if((e.stun>0||o.stun>0)&&cl>140&&e.spawn<=0&&o.spawn<=0){
          // 당구: 날아온 적과 맞은 적 모두 충격량만큼 피해, 맞은 적도 날아감
          const D=J*U.ricochet*U.dmgMul;
          maybeHole((e.x+o.x)/2,(e.y+o.y)/2);
          if(o.hitCd<=0){o.stun=Math.max(o.stun,clamp(J/mo/900,.15,.8));o.hp-=D;o.hitCd=.1;
            if(dP(o.x,o.y)<1100)burst((e.x+o.x)/2,(e.y+o.y)/2,clamp(Math.floor(J/150),4,24),'#ffffff',300);
            if(o.hp<=0)killEnemy(o,J);}
          if(e.hitCd<=0){addDmg('billiard',Math.min(D,Math.max(0,e.hp)));e.hp-=D;e.hitCd=.1;if(e.hp<=0)killEnemy(e,J);}
        }
      }
    }
  }
}
function updateFx(dt){
  shake=Math.min(SHAKE_MAX,shake)*Math.exp(-9*dt);flash=Math.max(0,flash-dt);banner=Math.max(0,banner-dt);
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;const f=Math.exp(-3*dt);p.vx*=f;p.vy*=f;p.life-=dt;}
  parts=parts.filter(p=>p.life>0);
  for(const r of rings)r.life-=dt;rings=rings.filter(r=>r.life>0);
  for(const f of flashes)f.life-=dt;flashes=flashes.filter(f=>f.life>0);

const rgbCache=new Map();
function rgbOf(c){
  let v=rgbCache.get(c);if(v)return v;
  let h=(c||'').replace('#','');
  if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  v=/^[0-9a-fA-F]{6}$/.test(h)?parseInt(h.slice(0,2),16)+','+parseInt(h.slice(2,4),16)+','+parseInt(h.slice(4,6),16):'255,255,255';

}
const glowCache=new Map();

  let c=glowCache.get(rgb);if(c)return c;
  c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.16,'rgba('+rgb+',.95)');
  gr.addColorStop(.42,'rgba('+rgb+',.32)');gr.addColorStop(1,'rgba('+rgb+',0)');
  g.fillStyle=gr;g.fillRect(0,0,64,64);glowCache.set(rgb,c);return c;
}

/* =========================================================
   입력 / 루프
   ========================================================= */
addEventListener('keydown',e=>{
  if(['Enter','Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Quote','Slash','Tab','Backspace'].includes(e.code)||menu||Object.values(S.keys).some(k=>k.includes(e.code)))e.preventDefault();
  initAudio();
  if(!(menu&&menu.listen)&&e.key&&e.key.length===1){devBuf=(devBuf+e.key.toLowerCase()).slice(-DEV_CODE.length);if(devBuf===DEV_CODE){devBuf='';devToggle();return;}}
  if(devOpen){if(e.code==='Escape')devToggle();return;}
  if(menu){if(!e.repeat||!menu.listen)menuKey(e);return;}
  if(e.code==='Escape'&&!e.repeat&&state!=='title'){openMenu();return;}
  keys[e.code]=true;
  if(tut&&state==='play'&&e.code==='Enter'&&!e.repeat){endTutorial();return;}
  if(state==='upgrade'&&!e.repeat){
    if(e.code===S.keys.left[0]||e.code===S.keys.left[1]||e.code==='ArrowLeft'){sel=(sel+opts.length-1)%opts.length;sfxOrb(4);}
    else if(e.code===S.keys.right[0]||e.code===S.keys.right[1]||e.code==='ArrowRight'){sel=(sel+1)%opts.length;sfxOrb(8);}
    else if(e.code==='Enter'||e.code==='NumpadEnter'||e.code==='Space'){pick(sel);}
  }
  if(state==='dead'&&e.code==='KeyR')initGame(false);
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(!menu&&!devOpen&&(state==='play'||state==='upgrade'))openMenu();});   // 창을 벗어나면 자동 일시정지
cv.addEventListener('pointermove',ev=>{
  const r=cv.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*W,y=(ev.clientY-r.top)/r.height*H;
  if(menu){menuPointer(x,y,false);return;}
  if(state!=='upgrade')return;
  for(let i=0;i<opts.length;i++){const c=cardRect(i);if(x>=c.x&&x<=c.x+c.w&&y>=c.y&&y<=c.y+c.h)sel=i;}
});
cv.addEventListener('pointerdown',ev=>{
  initAudio();
  const r=cv.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width*W,y=(ev.clientY-r.top)/r.height*H;
  if(menu){menuPointer(x,y,true);return;}
  if(state==='dead'){initGame(false);return;}
  if(state==='upgrade')for(let i=0;i<opts.length;i++){const c=cardRect(i);if(x>=c.x&&x<=c.x+c.w&&y>=c.y&&y<=c.y+c.h){pick(i);break;}}
});
let last=performance.now();
function frame(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(devGod&&P){P.hp=U.hpMax;P.energy=Math.max(P.energy,U.energyMax*.5);}
  if(menu||devOpen){}
  else if(state==='play'){
    let g=dt;
    if(slowT>0){slowT-=dt;g=dt*.25;}            // 슬로모션 (실제 시간 기준)
    novaFx=Math.max(0,novaFx-dt*2.5);
    if(hitstop>0)hitstop-=dt;else{update(g);updateFx(g);}
  }
  else{updateFx(dt);if(state==='dead')deadT+=dt;}
  if(menu)shake=Math.min(SHAKE_MAX,shake)*Math.exp(-9*dt);   // 설정 창에서 흔들림 미리보기
  draw();
  requestAnimationFrame(frame);
}
initGame(true);
requestAnimationFrame(frame);

if(typeof location!=='undefined'&&/bot=/.test(location.hash||'')){
  const q=new URLSearchParams(location.hash.slice(1)),mode=q.get('bot')||'pro',speed=Math.max(1,Math.min(4,+(q.get('speed')||1)));
  const srcs=mode==='rl'?['tools/rl/features.js','tools/rl/net.js','tools/rl/models/'+(q.get('model')||'latest')+'.js']:['tools/sim/pro.js'];
  const load=i=>{if(i>=srcs.length)return run();const sc=document.createElement('script');sc.src=srcs[i];sc.onload=()=>load(i+1);
    sc.onerror=()=>{console.error(srcs[i]+' 를 불러오지 못함 (index.html 과 같은 폴더 기준 경로)');document.title='봇 관전 실패: '+srcs[i];};document.body.appendChild(sc);};
  const run=()=>{
    const M=window.__mass;S.keys=JSON.parse(JSON.stringify(DEF_KEYS));
    const set=(k,v)=>{keys[k]=!!v;};let bot;
    if(mode==='rl'){const m=window.RL_MODEL;
      if(!window.RLFeatures.compatible(m.spec,M)){console.error('모델이 지금 게임과 맞지 않음 (카드·적 종류·스킬 상태가 바뀜). 다시 학습 필요');document.title='봇 관전 실패: 모델 사양 불일치';return;}
      bot=window.RLNet.makeBot(M,set,m,{greedy:q.get('greedy')==='1'});}
    else bot=window.ProBot(M,set,mode==='proevade');
    endTutorial();initGame(false);document.title='봇 관전 ('+mode+(mode==='rl'?' '+(q.get('model')||'latest'):'')+(speed>1?' ×'+speed:'')+')';
    let deadAt=0;
    (function loop(){
      if(state==='play'&&!menu&&!devOpen){bot.tick();for(let i=1;i<speed;i++){if(state!=='play')break;update(1/60);updateFx(1/60);bot.tick();}}
      else if(state==='upgrade')pick(bot.pickCard());
      else if(state==='dead'){if(!deadAt)deadAt=performance.now();else if(performance.now()-deadAt>3000){deadAt=0;initGame(false);}}
      requestAnimationFrame(loop);
    })();
  };
  load(0);
}
